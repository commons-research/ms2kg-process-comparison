name: Benchmark comparison

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --requirement requirements.txt
      - run: python -B -m unittest discover
      - run: python -B benchmark.py publish --check
      - name: Validate each trial against the common SHACL profile
        run: python -B schema/validate.py
      - run: python -B -m unittest discover -s rdf -p test_compare_pairs.py
      - name: Verify the published taxon–chemical comparison from RDF
        run: |
          python -B rdf/compare_pairs.py --input-dir rdf --output-dir "$RUNNER_TEMP/pairs"
          diff rdf/pair-summary.md "$RUNNER_TEMP/pairs/pair-summary.md"
          cmp rdf/pair-evidence.tsv "$RUNNER_TEMP/pairs/pair-evidence.tsv"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison
          path: results/
          if-no-files-found: error
